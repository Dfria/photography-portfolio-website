<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Album — Portfolio</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <div class="brand">Portfolio<span>.</span></div>
        <a class="back-link" href="/index.html">← All albums</a>
      </div>
    </header>

    <main class="container">
      <section class="page-intro">
        <h1 id="album-title">Loading…</h1>
        <p id="album-description"></p>
      </section>

      <section id="media" class="media-grid" aria-live="polite">
        <div class="state">Loading media…</div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">Built as a static site · Deployed on GitHub Pages</div>
    </footer>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Media viewer">
      <button class="lightbox-btn lightbox-close" id="lb-close" aria-label="Close">✕</button>
      <button class="lightbox-btn lightbox-prev" id="lb-prev" aria-label="Previous">‹</button>
      <button class="lightbox-btn lightbox-next" id="lb-next" aria-label="Next">›</button>
      <div class="lightbox-content" id="lb-content"></div>
      <div class="lightbox-caption" id="lb-caption"></div>
    </div>

    <script type="module" src="/src/album.js"></script>
  </body>
</html>
